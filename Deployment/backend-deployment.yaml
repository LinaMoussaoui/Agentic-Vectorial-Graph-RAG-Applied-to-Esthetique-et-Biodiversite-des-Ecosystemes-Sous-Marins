apiVersion:apps/v1
kind:Deployment
metadata:
  name:pfa-rag-backend
  labels:
    app:pfa-rag-backend
spec:
  replicas:1
  selector:
    matchLabels:
      app:pfa-rag-backend
  template:
    metadata:
      labels:
        app:pfa-rag-backend
    spec:
      containers:
      -name:backend
        image:khadijajouichat/pfa-rag-backend:latest
        imagePullPolicy:Always
        ports:
        -containerPort:8000
        env:
        -name:NEO4J_URI
          value:"neo4j+s://84e63db1.databases.neo4j.io"
        -name:NEO4J_USERNAME
          value:"84e63db1"
        -name:NEO4J_PASSWORD
          value:"hllD2qKPBHU6us9JJ6fUPiK7KLwMzpi56m-l99DKUNo"
        resources:
          limits:
            cpu:"1"
            memory:2Gi
          requests:
            cpu:"0.5"
            memory:1Gi
---
apiVersion:v1
kind:Service
metadata:
  name:pfa-rag-backend-service
spec:
  type:NodePort
  selector:
    app:pfa-rag-backend
  ports:
  -port:8000
    targetPort:8000
    nodePort:30080
